name: Discover streamer candidates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run discovery and ranking
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python -m app.pipeline
          python -m app.production_queue

      - name: Save candidate and approval snapshots
        run: |
          git config user.name "streamer-clips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/candidates.json data/approval_queue.json
          git diff --cached --quiet || git commit -m "chore: update discovery and approval queue"
          git push
