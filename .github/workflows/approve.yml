name: Process approval

on:
  workflow_dispatch:
    inputs:
      item_index:
        description: "Índice del Short en data/approval_queue.json (0, 1, 2...)"
        required: true
        type: string
      decision:
        description: "Decisión"
        required: true
        type: choice
        options:
          - approved
          - rejected

jobs:
  approval:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set approval status
        env:
          ITEM_INDEX: ${{ inputs.item_index }}
          DECISION: ${{ inputs.decision }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path("data/approval_queue.json")
          index = int(os.environ["ITEM_INDEX"])
          decision = os.environ["DECISION"]

          queue = json.loads(path.read_text(encoding="utf-8"))
          if index < 0 or index >= len(queue):
              raise SystemExit(f"Índice inválido: {index}")

          queue[index]["status"] = decision
          path.write_text(
              json.dumps(queue, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Item {index}: {decision}")
          PY

      - name: Save decision
        run: |
          git config user.name "streamer-clips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/approval_queue.json
          git diff --cached --quiet || git commit -m "chore: process approval decision"
          git push
